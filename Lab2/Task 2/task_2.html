<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Instagram login</title>
    <link rel="stylesheet" href="style_2.css">
</head>
<body>

<main class="main-container">
    <section class="hero-section">
        <div class="hero-content">
            <img src="https://img.freepik.com/premium-vector/circle-instagram-logotype-icon-social-media-app-network-application-popular-editorial-brand-vector-illustration_913857-383.jpg?semt=ais_hybrid&w=740&q=80" alt="Instagram" class="logo">
            <h1>Посмотрите, какими моментами из жизни поделились ваши <span class="gradient-text">близкие друзья.</span></h1>

            <div class="image-stack">
                <img src="https://support.lunapic.com/editor/premade/transparent.gif" alt="Story 1" class="story-img img-1">
                <img src="https://www.freeiconspng.com/thumbs/youtube-logo-png/hd-youtube-logo-png-transparent-background-20.png" alt="Story 2" class="story-img img-main">
                <img src="https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/0/e/e/0eeeb19633422b1241f4306419a0f15f39d58de9.png" alt="Story 3" class="story-img img-3">
            </div>
        </div>
    </section>

    <section class="login-section">
        <div class="login-box">
            <p class="login-title">Войти в Instagram</p>
            <form>
                <input type="text" placeholder="Имя пользователя, номер мобильного..." class="input-field">
                <input type="password" placeholder="Пароль" class="input-field">
                <button type="submit" class="login-btn">Войти</button>
            </form>

            <a href="#" class="forgot-password">Забыли пароль?</a>

            <div class="separator"></div>

            <button class="fb-login-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png" width="16">
                Войти через Facebook
            </button>

            <button class="create-account-btn">Создать новый аккаунт</button>

            <div class="meta-footer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Meta_Platforms_Inc._logo.svg/1200px-Meta_Platforms_Inc._logo.svg.png" alt="Meta" width="60">
            </div>
        </div>
    </section>
</main>

<footer class="page-footer">
    <nav>
        <a href="#">Meta</a> <a href="#">Информация</a> <a href="#">Блог</a> <a href="#">Вакансии</a> <a href="#">Помощь</a> <a href="#">API</a> <a href="#">Конфиденциальность</a> <a href="#">Условия</a>
    </nav>
    <p>Русский <span>© 2026 Instagram from Meta</span></p>
</footer>

</body>
</html>
